[project]
name = "seleniumbase-mcp"
version = "0.1.1"
description = "MCP servers exposing SeleniumBase as tools for MCP clients."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "mcp",
    "model-context-protocol",
    "seleniumbase",
    "sbase",
    "selenium",
    "webdriver",
    "browser-automation",
    "web-scraping",
    "cdp",
    "chrome-devtools-protocol",
    "claude",
    "claude-desktop",
    "claude-code",
    "ai-agent",
    "llm-tools",
    "testing",
    "stealth",
    "bot-detection",
    "captcha",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
authors = [{ name = "Michael Mintz", email = "mdmintz@gmail.com" }]
maintainers = [{ name = "Michael Mintz" }]
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "seleniumbase>=4.52.1",
    "uv>=0.12.5"
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/seleniumbase/seleniumbase-mcp"
Source = "https://github.com/seleniumbase/seleniumbase-mcp"
Repository = "https://github.com/seleniumbase/seleniumbase-mcp"
Documentation = "https://github.com/seleniumbase/seleniumbase-mcp"
Issues = "https://github.com/seleniumbase/seleniumbase-mcp/issues"
SeleniumBase = "https://github.com/seleniumbase/SeleniumBase"

[project.scripts]
seleniumbase-cdp = "cdp_server:main"
seleniumbase-driver = "driver_server:main"
seleniumbase-sb = "sb_server:main"

[build-system]
requires = ["setuptools>=70.2.0", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cdp_server", "driver_server", "sb_server"]

[tool.setuptools.exclude-package-data]
"*" = [".venv*", "build*", "dist*", "uv.lock"]
